<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | MAV Estate</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f6f2ea; }
  .bar { background: #123a33; color: #fff; }
  .btn-pine { background: #123a33; color: #fff; border-radius: 3rem; font-weight: 600; padding: .6rem 1.4rem; }
  .btn-pine:hover { background: #0c2823; color: #fff; }
  .thumb { width: 72px; height: 54px; object-fit: cover; background: #e9e1d0; border-radius: .4rem; }
  .preview { max-height: 160px; border-radius: .5rem; }
</style>
</head>
<body>
<div class="bar py-3"><div class="container d-flex justify-content-between align-items-center">
  <strong>MAV Estate Admin</strong>
  <div><a class="btn btn-sm btn-outline-light me-2" href="/" target="_blank">View website</a><span class="me-2 small" id="who"></span><button class="btn btn-sm btn-light" id="out">Log out</button></div>
</div></div>

<div class="container py-4 d-none" id="panel">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div><h1 class="h3 mb-0">Properties</h1><small class="text-muted"><span id="count">0</span> listed on the website</small></div>
    <button class="btn btn-pine btn-lg" id="openAdd">+ Add property</button>
  </div>

  <div class="card"><div class="card-body">
    <div class="table-responsive"><table class="table align-middle mb-0">
      <thead><tr><th></th><th>Property</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="text-muted d-none my-4 text-center" id="none">No properties yet. Click “Add property” to publish your first one.</p>
  </div></div>
</div>

<!-- Add property modal -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="f">
    <div class="modal-header"><h2 class="modal-title h5" id="addTitle">Add property</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-12"><label class="form-label" for="title">Title</label><input id="title" class="form-control" maxlength="120" required></div>
      <div class="col-md-6"><label class="form-label" for="category">Category</label><select id="category" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label" for="status">Status</label><select id="status" class="form-select"><option>Available</option><option>Sold</option></select></div>
      <div class="col-md-6"><label class="form-label" for="price">Price (₹)</label><input id="price" type="number" min="0" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="location">Location</label><input id="location" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label" for="beds">Bedrooms</label><input id="beds" type="number" min="0" class="form-control" value="0"></div>
      <div class="col-md-6"><label class="form-label" for="area">Area (sq ft)</label><input id="area" type="number" min="0" class="form-control"></div>
      <div class="col-md-6"><label class="form-label" for="file">Photo</label><input id="file" type="file" accept="image/*" class="form-control"></div>
      <div class="col-md-6"><label class="form-label" for="url">Or photo link</label><input id="url" class="form-control" placeholder="https://"></div>
      <div class="col-12"><img id="prev" class="preview d-none" alt="Photo preview"></div>
      <div class="col-12"><label class="form-label" for="description">Description</label><textarea id="description" rows="4" class="form-control"></textarea></div>
      <div class="col-12 text-danger small" id="ferr" role="alert"></div>
    </div></div>
    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-pine" id="save">Publish to website</button></div>
  </form></div>
</div>

<!-- Success toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div class="toast text-bg-success" id="toast" role="status" aria-live="polite">
  <div class="toast-body" id="toastMsg"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let photo = '';
const modal = () => bootstrap.Modal.getOrCreateInstance($('addModal'));
const notify = (html) => { $('toastMsg').innerHTML = html; bootstrap.Toast.getOrCreateInstance($('toast'), { delay: 5000 }).show(); };

async function load() {
  const list = await fetch('/api/properties').then(r => r.json());
  $('count').textContent = list.length;
  $('none').classList.toggle('d-none', list.length > 0);
  $('rows').innerHTML = list.map(p => `<tr>
    <td>${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="">` : '<div class="thumb"></div>'}</td>
    <td><strong>${esc(p.title)}</strong><br><small class="text-muted">${esc(p.location)}</small></td>
    <td>${esc(p.category)}</td><td>₹${Number(p.price).toLocaleString('en-IN')}</td>
    <td><span class="badge ${p.status === 'Sold' ? 'text-bg-secondary' : 'text-bg-success'}">${esc(p.status)}</span></td>
    <td class="text-end"><button class="btn btn-sm btn-outline-danger" data-del="${esc(p.id)}">Remove</button></td></tr>`).join('');
}

async function init() {
  const r = await fetch('/api/me');
  if (!r.ok) return location.replace('/admin/login');
  $('who').textContent = (await r.json()).user;
  $('panel').classList.remove('d-none');
  const cats = await fetch('/api/categories').then(r => r.json());
  $('category').innerHTML = cats.map(c => `<option>${esc(c)}</option>`).join('');
  load();
}
$('out').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.replace('/admin/login'); };

$('openAdd').onclick = () => { $('f').reset(); photo = ''; $('prev').classList.add('d-none'); $('ferr').textContent = ''; modal().show(); };
$('addModal').addEventListener('shown.bs.modal', () => $('title').focus());

function showPreview(src) { $('prev').src = src; $('prev').classList.toggle('d-none', !src); }
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 900 / img.width), c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    photo = c.toDataURL('image/jpeg', 0.8); showPreview(photo);
  };
  img.src = URL.createObjectURL(f);
};
$('url').oninput = () => { if (!photo) showPreview($('url').value.trim()); };

$('f').onsubmit = async e => {
  e.preventDefault(); $('save').disabled = true; $('ferr').textContent = '';
  const body = {};
  ['title', 'category', 'status', 'price', 'location', 'beds', 'area', 'description'].forEach(k => body[k] = $(k).value);
  body.image = photo || $('url').value.trim();
  try {
    const r = await fetch('/api/properties', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) return location.replace('/admin/login');
    if (!r.ok) { $('ferr').textContent = (await r.json()).error || 'Could not save. Check the fields and try again.'; return; }
    const p = await r.json();
    modal().hide(); await load();
    notify(`“${esc(p.title)}” is now live on the website. <a class="text-white fw-semibold" href="/#listings" target="_blank">View it</a>`);
  } catch { $('ferr').textContent = 'Could not reach the server. Try again.'; }
  finally { $('save').disabled = false; }
};

$('rows').addEventListener('click', async e => {
  const id = e.target.dataset.del; if (!id || !confirm('Remove this property from the website?')) return;
  const r = await fetch('/api/properties/' + id, { method: 'DELETE' });
  if (r.status === 401) return location.replace('/admin/login');
  await load(); notify('Property removed from the website.');
});

init();
</script>
</body>
</html>
